name: CI
on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: >-
      github.event_name != 'pull_request_target'
      || contains(github.event.pull_request.labels.*.name, 'trusted')
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
          # Empty on push/workflow_dispatch — falls back to default ref
          ref: "${{ github.event.pull_request.merge_commit_sha }}"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # Node is still used to run .github/scripts/deploy.mjs.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Install
        id: install
        run: |
          bun install --frozen-lockfile

      - name: Commit lockfile
        if: ${{ env.IS_DEPENDABOT == 1 }}
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321
        with:
          add: "bun.lock"
          fetch: false
          github_token: "${{ github.token }}"
          message: "Update lockfile"

      - name: Generate types
        run: bunx astro sync
        env:
          OG_IMAGE_SECRET: placeholder

      - name: Run linter
        run: bun run lint --quiet

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test src

      - name: Build
        run: bun run build
        env:
          OG_IMAGE_SECRET: ${{ secrets.OG_IMAGE_SECRET || 'placeholder' }}

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        run: bunx playwright install-deps chromium
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright browsers
        run: bunx playwright install chromium
        timeout-minutes: 5

      - name: Run tests
        id: test
        run: bun run test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy Production to Vercel
        if: ${{ env.HAS_VERCEL == 'true' && env.IS_PROD_RUN == 'true' }}
        run:
          node .github/scripts/deploy.mjs --token=${{ secrets.VERCEL_TOKEN }}
          --prod
        env:
          OG_IMAGE_SECRET: ${{ secrets.OG_IMAGE_SECRET }}

      - name: Deploy Preview to Vercel
        if: ${{ env.HAS_VERCEL == 'true' && env.IS_PR_RUN == 'true' && env.IS_TRUSTED == 'true' }}
        run: node .github/scripts/deploy.mjs --token=${{ secrets.VERCEL_TOKEN }}
        env:
          OG_IMAGE_SECRET: ${{ secrets.OG_IMAGE_SECRET }}

      - name: Create GitHub Preview Deployment
        if: ${{ env.HAS_VERCEL == 'true' && env.IS_PR_RUN == 'true' && env.IS_TRUSTED == 'true' }}
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.DEPLOYMENT_ALIAS }}
          environment: Preview
          production-environment: false
          initial-status: success
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Create GitHub Production Deployment
        if: ${{ env.HAS_VERCEL == 'true' && env.IS_PROD_RUN == 'true' }}
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.PRODUCTION_HOSTNAME }}
          environment: Production
          production-environment: true
          initial-status: success
    outputs:
      deployment: ${{ env.DEPLOYMENT_ALIAS || env.PRODUCTION_HOSTNAME }}
      has-vercel: ${{ env.HAS_VERCEL }}
      is-trusted: ${{ env.IS_TRUSTED }}

  lighthouse:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-deploy.outputs.has-vercel == 'true' && needs.build-and-deploy.outputs.is-trusted == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Audit URLs
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: |
            https://${{ needs.build-and-deploy.outputs.deployment }}/
            https://${{ needs.build-and-deploy.outputs.deployment }}/features/asides/
            https://${{ needs.build-and-deploy.outputs.deployment }}/features/shiki-twoslash/
          budgetPath: ".github/lighthouse-budget.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

  remove-trusted-label:
    needs: lighthouse
    runs-on: ubuntu-latest
    if: always() && contains(github.event.pull_request.labels.*.name, 'trusted')
    steps:
      - name: Remove trusted label
        run: |
          gh api /repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/trusted -X DELETE
        env:
          GITHUB_TOKEN: "${{ github.token }}"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  IS_DEPENDABOT: ${{ secrets.IS_DEPENDABOT }}
  REF_NAME: "${{ github.head_ref || github.ref_name }}"
  PRODUCTION_HOSTNAME: lol.haspar.us
  # Token presence is used as proxy for full deploy capability (also needs VERCEL_ORG_ID/VERCEL_PROJECT_ID)
  HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
  IS_PROD_RUN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' }}
  IS_PR_RUN: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}
  IS_TRUSTED: ${{ !github.event.pull_request.head.repo.fork || (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'trusted')) }}
