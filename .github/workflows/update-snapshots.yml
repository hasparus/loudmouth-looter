name: Update Snapshots
on:
  workflow_dispatch:

# Throwaway helper: regenerates visual-regression baselines on the same
# ubuntu-latest renderer CI uses, then uploads them as an artifact. Remove
# once the linux baselines are committed.
jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx astro sync
        env:
          OG_IMAGE_SECRET: placeholder

      - run: bun run build
        env:
          OG_IMAGE_SECRET: placeholder

      - run: bunx playwright install-deps chromium
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - run: bunx playwright install chromium
        timeout-minutes: 5

      - run: bunx playwright test visual-regression --update-snapshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: updated-snapshots
          path: e2e/visual-regression.spec.ts-snapshots/
